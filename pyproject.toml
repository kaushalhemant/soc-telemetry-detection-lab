[project]
name = "soc-telemetry-detection-lab"
version = "0.1.0"
description = "SOC Telemetry Generation & Detection Lab Engine API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pytest>=7.3.0",
    "websockets>=11.0.3",
    "jinja2>=3.1.2"
]

[tool.vercel]
entrypoint = "api.index:app"
includeFiles = ["rules/**", "web/**"]
